<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Алкогольная Витрина</title>
    <script src="https://telegram.org"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #fdfafb; margin: 0; padding: 15px; color: #333; }
        h1 { text-align: center; color: #4a1525; font-size: 22px; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #777; font-size: 12px; margin-bottom: 20px; }
        .catalog { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .product { background: white; padding: 12px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); text-align: center; display: flex; flex-direction: column; justify-content: space-between; border: 1px solid #f0e6e8; }
        .product-icon { font-size: 48px; margin: 10px 0; }
        .title { font-size: 14px; font-weight: bold; margin: 5px 0; min-height: 34px; display: flex; align-items: center; justify-content: center; }
        .price { color: #4a1525; font-weight: bold; margin-bottom: 10px; font-size: 16px; }
        .btn { background: #4a1525; color: white; border: none; padding: 10px; border-radius: 8px; width: 100%; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn.added { background: #28a745; }
    </style>
</head>
<body>

    <h1>🍷 Демо-витрина GRADUS</h1>
    <div class="subtitle">Предзаказ и самовывоз (18+)</div>
    
    <div class="catalog" id="catalog"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Список товаров со смайликами вместо нестабильных ссылок
        const products = [
            { id: 1, name: "Вино сухое красное", price: "850 ₽", icon: "🍷" },
            { id: 2, name: "Виски односолодовый", price: "3 200 ₽", icon: "🥃" },
            { id: 3, name: "Игристое брют", price: "1 100 ₽", icon: "🍾" },
            { id: 4, name: "Пиво крафтовое", price: "350 ₽", icon: "🍺" }
        ];

        let cart = [];

        const catalogContainer = document.getElementById('catalog');
        products.forEach(prod => {
            const card = document.createElement('div');
            card.className = 'product';
            card.innerHTML = `
                <div class="product-icon">${prod.icon}</div>
                <div class="title">${prod.name}</div>
                <div class="price">${prod.price}</div>
                <button class="btn" id="btn-${prod.id}" onclick="toggleCart(${prod.id})">В корзину</button>
            `;
            catalogContainer.appendChild(card);
        });

        function toggleCart(id) {
            const prod = products.find(p => p.id === id);
            const btn = document.getElementById(`btn-${id}`);
            const index = cart.findIndex(item => item.id === id);

            if (index > -1) {
                cart.splice(index, 1);
                btn.innerText = "В корзину";
                btn.className = "btn";
            } else {
                cart.push(prod);
                btn.innerText = "Добавлено ✓";
                btn.className = "btn added";
            }

            if (cart.length > 0) {
                tg.MainButton.text = `Оформить предзаказ (${cart.length})`;
                tg.MainButton.textColor = "#FFFFFF";
                tg.MainButton.color = "#4a1525";
                tg.MainButton.show();
            } else {
                tg.MainButton.hide();
            }
        }

        tg.onEvent('mainButtonClicked', function() {
            let orderText = "📥 Новый предзаказ GRADUS:\n\n";
            cart.forEach(item => {
                orderText += `${item.icon} ${item.name} — ${item.price}\n`;
            });
            orderText += "\n⚠️ Выдача строго в магазине при предъявлении паспорта (18+).";
            
            tg.sendData(orderText);
        });
    </script>
</body>
</html>
